<!doctype html>
<!--
  Share images of the portfolio (1200×630), FR (?lang=fr) and EN (?lang=en).
  The plate of the site — rails, rules, crosses, a hatched band — around the
  name, and on the right the portrait as a dot screen of its light.
  Rendered with headless Chrome: see README → Conventions médias.
-->
<html lang="fr">
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: "Funnel Display"; src: url("../../assets/fonts/funnel-display-latin.woff2") format("woff2"); font-weight: 300 800; font-display: block; }
  @font-face { font-family: "Funnel Sans"; src: url("../../assets/fonts/funnel-sans-latin.woff2") format("woff2"); font-weight: 300 800; font-display: block; }
  @font-face { font-family: "Geist Mono"; src: url("../../assets/fonts/geist-mono-latin.woff2") format("woff2"); font-weight: 400 500; font-display: block; }

  :root {
    --bg: #09090b; --surface: #111114; --ink: #f4f4f5; --ink-2: #a8a8b3; --ink-3: #75757f;
    --rule: #2c2c34; --cross: #6a6a76; --accent: #8aa2ff;
    /* The plate: rails at x = 56 and 1144, rules at y = 76 and 560, and
       the portrait column from x = 684. Everything is drawn to survive a
       preview at about 40 % of this size: 2 px rules, large type, a coarse
       screen. */
    --l: 56px; --r: 1144px; --t: 76px; --b: 560px; --split: 684px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; background: var(--bg); color: var(--ink); }

  .line { position: absolute; background: var(--rule); }
  .v { top: 0; bottom: 0; width: 2px; margin-left: -1px; }
  .h { left: 0; right: 0; height: 2px; margin-top: -1px; }
  .cross { position: absolute; width: 18px; height: 18px; transform: translate(-9px, -9px); }
  .cross::before, .cross::after { content: ""; position: absolute; background: var(--cross); }
  .cross::before { left: 8px; top: 0; width: 2px; height: 18px; }
  .cross::after { top: 8px; left: 0; height: 2px; width: 18px; }

  /* The hatched band under the plate, as between the site's sections. */
  .hatch { position: absolute; left: var(--l); right: calc(1200px - var(--r)); top: calc(var(--b) + 1px); bottom: 0;
    background: repeating-linear-gradient(-45deg, var(--rule) 0 2px, transparent 2px 16px); }

  .top { position: absolute; left: calc(var(--l) + 28px); right: calc(1200px - var(--r) + 28px); top: 0; height: var(--t);
    display: flex; align-items: center; justify-content: space-between;
    font-family: "Geist Mono"; font-size: 21px; color: var(--ink-2); letter-spacing: 0; }
  .brand { display: flex; align-items: center; gap: 14px; color: var(--ink); }
  .mark { display: grid; place-items: center; width: 40px; height: 40px; border-radius: 10px; background: var(--ink); color: var(--bg);
    font-family: "Funnel Display"; font-weight: 700; font-size: 17px; letter-spacing: -.03em; }

  .text { position: absolute; left: calc(var(--l) + 44px); width: calc(var(--split) - var(--l) - 72px); top: calc(var(--t) + 34px); }
  .kicker { font-family: "Geist Mono"; font-size: 21px; font-weight: 500; letter-spacing: .06em; text-transform: uppercase; color: var(--accent); }
  h1 { margin-top: 20px; font-family: "Funnel Display"; font-weight: 680; font-size: 112px; line-height: .9; letter-spacing: -.055em; }
  .lede { margin-top: 24px; font-family: "Funnel Sans"; font-size: 29px; font-weight: 450; line-height: 1.3; color: var(--ink-2); }
  .lede b { font-weight: 600; color: var(--ink); }

  /* A ruled row of cells along the bottom rule of the plate. */
  .cells { position: absolute; left: var(--l); width: calc(var(--split) - var(--l)); top: calc(var(--b) - 96px); height: 96px;
    display: grid; grid-template-columns: auto 1fr; border-top: 2px solid var(--rule); }
  .cell { display: flex; align-items: center; gap: 14px; padding: 0 22px 0 44px; font-family: "Funnel Sans"; font-size: 23px; font-weight: 600; letter-spacing: -.01em; white-space: nowrap; }
  .cell + .cell { border-left: 2px solid var(--rule); padding-left: 24px; }
  .dot { width: 14px; height: 14px; border-radius: 50%; background: #1fbf75; box-shadow: 0 0 0 6px rgb(31 191 117 / .18); }
  .icon { display: grid; place-items: center; width: 44px; height: 44px; border-radius: 11px; background: var(--surface); box-shadow: inset 0 0 0 2px #3a3a44; color: var(--ink); }
  .icon svg { width: 22px; height: 22px; }

  canvas { position: absolute; left: calc(var(--split) + 1px); top: calc(var(--t) + 1px); width: calc(var(--r) - var(--split) - 2px); height: calc(var(--b) - var(--t) - 2px); }
</style>
</head>
<body>
  <canvas id="c"></canvas>
  <div class="hatch"></div>

  <div class="line v" style="left: var(--l)"></div>
  <div class="line v" style="left: var(--r)"></div>
  <div class="line v" style="left: var(--split); top: var(--t); bottom: calc(630px - var(--b))"></div>
  <div class="line h" style="top: var(--t)"></div>
  <div class="line h" style="top: var(--b)"></div>
  <div class="cross" style="left: var(--l); top: var(--t)"></div>
  <div class="cross" style="left: var(--r); top: var(--t)"></div>
  <div class="cross" style="left: var(--l); top: var(--b)"></div>
  <div class="cross" style="left: var(--r); top: var(--b)"></div>
  <div class="cross" style="left: var(--split); top: var(--t)"></div>
  <div class="cross" style="left: var(--split); top: var(--b)"></div>

  <header class="top">
    <span class="brand"><span class="mark">TA</span>talvin-ackbaraly.com</span>
    <span id="where"></span>
  </header>

  <div class="text">
    <p class="kicker" id="kicker"></p>
    <h1>Talvin<br>Ackbaraly</h1>
    <p class="lede" id="lede"></p>
  </div>

  <div class="cells">
    <div class="cell"><span class="dot"></span><span id="status"></span></div>
    <div class="cell"><span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 16.5c-1.5 1.26-2 5-2 5s3.74-.5 5-2c.71-.84.7-2.13-.09-2.91a2.18 2.18 0 0 0-2.91-.09z"/><path d="m12 15-3-3a22 22 0 0 1 2-3.95A12.88 12.88 0 0 1 22 2c0 2.72-.78 7.5-6 11a22.35 22.35 0 0 1-4 2z"/><path d="M9 12H4s.55-3.03 2-4c1.62-1.08 5 0 5 0"/><path d="M12 15v5s3.03-.55 4-2c1.08-1.62 0-5 0-5"/></svg></span><span id="teaso"></span></div>
  </div>

<script>
const L = new URLSearchParams(location.search).get("lang") || "fr";
const copy = {
  fr: { where: "EPITA · Paris", kicker: "Vision · IA · Calcul GPU", lede: "Élève ingénieur à l'EPITA,<br><b>majeure Image</b>.", status: "Stage dès février 2027", teaso: "Fondateur de Teaso" },
  en: { where: "EPITA · Paris", kicker: "Vision · AI · GPU computing", lede: "Engineering student at EPITA,<br><b>Image major</b>.", status: "Internship from Feb. 2027", teaso: "Founder of Teaso" },
}[L];
document.documentElement.lang = L;
for (const k of ["where", "kicker", "status", "teaso"]) document.getElementById(k).textContent = copy[k];
document.getElementById("lede").innerHTML = copy.lede;

// ─── The portrait, as a vision pipeline sees it ───
const canvas = document.getElementById("c");
const W = canvas.clientWidth, H = canvas.clientHeight, dpr = 2;
canvas.width = W * dpr; canvas.height = H * dpr;
const ctx = canvas.getContext("2d");
ctx.scale(dpr, dpr);

const img = new Image();
img.src = "photo-src.jpg";
img.onload = () => {
  const S = 7;                      // pitch of the screen, CSS px: coarse enough to survive a small preview
  const cols = Math.ceil(W / S), rows = Math.ceil(H / S);

  // The photo cropped to the column: head and shoulders.
  const crop = { x: 0.13, y: 0.025, w: 0.74 };         // fractions of the photo
  crop.h = crop.w * (H / W) * (img.width / img.height);
  const read = (w, h, blur) => {
    const c = document.createElement("canvas");
    c.width = w; c.height = h;
    const g = c.getContext("2d", { willReadFrequently: true });
    if (blur) g.filter = `blur(${blur}px)`;
    g.drawImage(img, crop.x * img.width, crop.y * img.height, crop.w * img.width, crop.h * img.height, 0, 0, w, h);
    return g.getImageData(0, 0, w, h).data;
  };
  const px = read(cols, rows, 0);

  // The backdrop of the photo is a flat light grey: the person is whatever
  // strays from it, softened so the outline does not stair-step.
  const bg = [px[0], px[1], px[2]];
  const lum = new Float32Array(cols * rows), fig = new Float32Array(cols * rows);
  for (let i = 0; i < cols * rows; i++) {
    const r = px[i*4], gg = px[i*4+1], b = px[i*4+2];
    lum[i] = (0.299*r + 0.587*gg + 0.114*b) / 255;
    const d = Math.hypot(r - bg[0], gg - bg[1], b - bg[2]);
    fig[i] = Math.min(1, Math.max(0, (d - 10) / 22));
  }
  const at = (a, x, y, w = cols, h = rows) => a[Math.min(h-1, Math.max(0, y)) * w + Math.min(w-1, Math.max(0, x))];
  const soft = new Float32Array(cols * rows);
  for (let y = 0; y < rows; y++) for (let x = 0; x < cols; x++) {
    let s = 0; for (let j = -1; j <= 1; j++) for (let i = -1; i <= 1; i++) s += at(fig, x+i, y+j);
    soft[y*cols+x] = s / 9;
  }

  const dots = new Path2D(), faint = new Path2D();
  for (let y = 0; y < rows; y++) for (let x = 0; x < cols; x++) {
    const i = y*cols + x, cx = x*S + S/2, cy = y*S + S/2;
    // Light becomes dots: a brighter cell, a bigger dot. Tones are stretched
    // over the figure, so the face carries as much as the shirt.
    const t = Math.min(1, Math.max(0, (lum[i] - 0.06) / 0.62));
    const r = S * 0.5 * Math.sqrt(Math.pow(t, 0.85) * soft[i]);
    if (r > 0.35) { dots.moveTo(cx + r, cy); dots.arc(cx, cy, r, 0, Math.PI * 2); }
    else if (soft[i] < 0.05) { faint.moveTo(cx + 0.9, cy); faint.arc(cx, cy, 0.9, 0, Math.PI * 2); }
  }
  ctx.fillStyle = "#2a2a31"; ctx.fill(faint);
  ctx.fillStyle = "#e9e9ee"; ctx.fill(dots);
  document.title = "ready";
};
</script>
</body>
</html>
